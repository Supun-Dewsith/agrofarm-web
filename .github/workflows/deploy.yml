name: Deploy Frontend to Cloudflare

on:
  push:
    branches:
      - dev 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application (SPA Mode)
        run: npm run build
        env:
          # Securely injects production Spring Boot API domain address
          VITE_API_URL: ${{ secrets.SPRING_BOOT_API_URL }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Points Wrangler to your verified, pre-built browser asset directory
          command: pages deploy build/client --project-name=agrofarm-web
